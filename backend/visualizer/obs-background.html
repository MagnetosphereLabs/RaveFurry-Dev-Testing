<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FURATIC OBS Background</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12294b}
canvas{display:block;width:100%;height:100%}
#status{position:absolute;bottom:10px;left:12px;color:#fff;font:13px system-ui;background:#15233bcc;padding:6px 9px;border-radius:5px;pointer-events:none}
#status[hidden]{display:none}

/* OBS broadcast overlay. The shared unit doubles the entire card, including
   spacing, artwork and typography. The WebGL scene remains independent. */
#vote-notice{
  --u:min(1.7vw,3.022226vh);
  position:fixed;right:calc(var(--u)*.6);top:calc(var(--u)*.6);z-index:2;
  width:max-content;max-width:calc(var(--u)*27);padding:calc(var(--u)*.75);
  border:1px solid rgba(255,255,255,.26);border-radius:calc(var(--u)*.9);
  color:#f5f7fc;background:linear-gradient(125deg,rgba(12,19,31,.40),rgba(12,19,31,.26));
  -webkit-backdrop-filter:blur(14px) saturate(115%);backdrop-filter:blur(14px) saturate(115%);
  font:500 calc(var(--u)*.86)/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  pointer-events:none;overflow:hidden;opacity:0;
  transform:translate(calc(var(--u)*1.5),calc(var(--u)*-.25)) scale(.97);
  transform-origin:right top;
}
#vote-notice[hidden]{display:none}
#vote-notice.is-visible{opacity:1;transform:translate(0,0) scale(1)}
.vote-notice-sheen{
  position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(110deg,transparent 32%,rgba(255,255,255,.22) 50%,transparent 68%);
  transform:translateX(-120%);
}
.vote-notice-header{display:flex;align-items:center;gap:calc(var(--u)*.55)}
.vote-notice-character{width:calc(var(--u)*2.75);height:calc(var(--u)*2.75);object-fit:contain;flex:none}
.vote-notice-heading{flex:1;min-width:0}
#vote-notice-headline{margin:0;font-size:calc(var(--u)*1.25);font-weight:750;line-height:1.16;letter-spacing:-.025em}
#vote-notice-badge{
  --metal-light:#edf7ff;--metal:#c5dbf4;--metal-dark:#687e99;--medal-ink:#172331;
  flex:none;width:calc(var(--u)*2.65);height:calc(var(--u)*3);transform-origin:center;
}
#vote-notice[data-rank="1"] #vote-notice-badge{--metal-light:#fff4cb;--metal:#f4cc74;--metal-dark:#a9792d;--medal-ink:#3b2b0b}
#vote-notice[data-rank="3"] #vote-notice-badge{--metal-light:#f4d6c1;--metal:#dda780;--metal-dark:#946344;--medal-ink:#392418}
#vote-notice-badge svg{display:block;width:100%;height:100%;overflow:visible}
.vote-notice-ribbon{fill:var(--metal-dark)}
.vote-notice-crown{display:none;fill:var(--metal);stroke:var(--metal-light);stroke-width:1.2;stroke-linejoin:round}
#vote-notice[data-rank="1"] .vote-notice-crown{display:block}
.vote-notice-ordinal{fill:var(--medal-ink);font:800 23px system-ui,sans-serif;letter-spacing:-1px}
.vote-notice-place{fill:var(--medal-ink);font:750 8px system-ui,sans-serif;letter-spacing:2px}
#vote-notice-badge .vote-notice-vote{display:none;color:#edf8ff}
#vote-notice[data-rank="0"] .vote-notice-medal{display:none}
#vote-notice[data-rank="0"] .vote-notice-vote{display:block}
.vote-notice-song{display:flex;align-items:baseline;gap:calc(var(--u)*.35);margin-top:calc(var(--u)*.35);min-width:0}
#vote-notice-title,#vote-notice-artist{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vote-notice-title{flex:0 1 auto;min-width:0;font-size:calc(var(--u)*.85);font-weight:650}
#vote-notice-artist{flex:0 1 auto;max-width:40%;font-size:calc(var(--u)*.66);color:#d0d9e4}
#vote-notice[data-kind="reminder"] .vote-notice-song{display:none}
#vote-notice-detail{margin:calc(var(--u)*.4) 0 0;color:#edf2f8;font-size:calc(var(--u)*.81);line-height:1.35}
.vote-notice-footer{display:flex;align-items:baseline;flex-wrap:wrap;gap:calc(var(--u)*.3);margin-top:calc(var(--u)*.35);padding-top:calc(var(--u)*.3);border-top:1px solid rgba(255,255,255,.16)}
#vote-notice-footer{font-size:calc(var(--u)*.6);color:#d0d9e4}
.vote-notice-url{font-size:calc(var(--u)*.86);font-weight:750;color:#a9dff1;letter-spacing:-.02em}

#obs-topbar{--u:min(1.7vw,3.022226vh);position:fixed;top:calc(var(--u)*.6);left:calc(var(--u)*.6);right:calc(var(--u)*.6);height:calc(var(--u)*8.19);z-index:2;display:grid;grid-template-columns:minmax(0,1fr) var(--obs-notice-width,max-content);gap:calc(var(--u)*.8);padding:calc(var(--u)*.75);border:1px solid #ffffff42;border-radius:calc(var(--u)*.9);color:#f5f7fc;background:linear-gradient(125deg,rgba(12,19,31,.40),rgba(12,19,31,.26));backdrop-filter:blur(9px) saturate(115%);-webkit-backdrop-filter:blur(9px) saturate(115%);font:400 calc(var(--u)*.86)/1.25 "Cracker Winter",sans-serif;pointer-events:none;overflow:hidden}

#obs-song{display:flex;align-items:center;gap:calc(var(--u)*.7);min-width:0;overflow:hidden}
#obs-artwork{position:relative;flex:none;width:var(--obs-cover-size,calc(var(--u)*6));height:var(--obs-cover-size,calc(var(--u)*6));border-radius:calc(var(--u)*.65);background:rgba(255,255,255,.045);overflow:hidden;box-shadow:0 8px 28px #0002;transition:width 500ms cubic-bezier(.22,1,.36,1),opacity 400ms ease}
#obs-artwork img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
#obs-artwork.is-empty{width:0;opacity:0;box-shadow:none}
.obs-song-copy{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*.36);padding:calc(var(--u)*.15) 0}

.obs-text-content{display:inline-block;width:max-content;max-width:none;white-space:nowrap;vertical-align:top;transform-origin:left center}
.obs-glyph{display:inline-block;transform-origin:50% 85%;transform:translate3d(0,0,0);backface-visibility:hidden}
.obs-outgoing-text{position:absolute;left:0;top:.08em;pointer-events:none}
#obs-song-title{font-size:calc(var(--u)*1.37);line-height:1.15}
#obs-song-artist{font-size:calc(var(--u)*1.01);color:#d8e2ef}

#obs-song-elapsed,#obs-song-duration{flex:none}
#obs-song-votes{margin-left:auto;font-size:calc(var(--u)*.8);max-width:45%}
.obs-time-divider{opacity:.5}
.obs-digit-cell{display:inline-block;position:relative;vertical-align:top;width:.7em;text-align:center}
.obs-digit-cell.is-colon{width:.35em}
.obs-digit-cell>span{display:block;transform-origin:50% 75%;transform:translate3d(0,0,0);backface-visibility:hidden}
.obs-digit-cell>.obs-glyph-out{position:absolute;inset:0}
.obs-progress{height:calc(var(--u)*.16);min-height:3px;background:#ffffff24;border-radius:99px;overflow:hidden;margin-top:calc(var(--u)*.1)}
#obs-progress-fill{display:block;width:100%;height:100%;background:linear-gradient(90deg,#89dfef,#d5b6f5);border-radius:inherit;transform:scaleX(0);transform-origin:left;transition:transform 120ms linear}

#vote-notice{--u:inherit;position:relative;inset:auto;width:auto;max-width:none;padding:0 0 0 calc(var(--u)*.8);border:0;border-left:1px solid #ffffff28;border-radius:0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;opacity:1;transform:none;overflow:hidden;font:inherit;display:flex;align-items:center}
.vote-notice-content{width:100%;min-width:0}
#vote-notice-headline{font-size:calc(var(--u)*1.15);line-height:1.16;letter-spacing:0}
#vote-notice-title,#vote-notice-artist{display:block;text-overflow:clip;font-weight:400}
#vote-notice-title{flex:1;min-width:0;font-size:calc(var(--u)*.84)}
#vote-notice-artist{max-width:42%;font-size:calc(var(--u)*.72)}
#vote-notice-detail{font-size:calc(var(--u)*.8);line-height:1.25;margin:calc(var(--u)*.25) 0 0}
#vote-notice-footer{font-size:calc(var(--u)*.65)}
.vote-notice-footer{margin-top:calc(var(--u)*.25);padding-top:calc(var(--u)*.25);flex-wrap:nowrap;overflow:hidden}
.vote-notice-url{font-size:calc(var(--u)*.85);flex:none}
.vote-notice-ordinal{font:400 23px "Cracker Winter",sans-serif}.vote-notice-place{font:400 8px "Cracker Winter",sans-serif}

#obs-topbar[data-mode="afterhours"] #vote-notice{visibility:hidden}

<script>

  'use strict';
  const canvas=document.getElementById('background'),status=document.getElementById('status');
  const options=new URLSearchParams(location.search);
  const debug=options.get('debug')==='1',demo=options.get('demo');
  const validModes=['silence','gentle','rhythm','intense'];
  const simulated=validModes.includes(demo);
  const port=Number(options.get('port')||((location.protocol==='http:'&&['127.0.0.1','localhost'].includes(location.hostname))?location.port:8766));
  const delay=Math.max(0,Math.min(.250,Number(options.get('delay')||0)/1000))||0;

  const vs = `#version 300 es
  in vec2 a_position;
  out vec2 v_uv;
  void main(){v_uv=a_position*.5+.5;gl_Position=vec4(a_position,0.,1.);}`;
  const fs = `#version 300 es
  precision highp float;
  in vec2 v_uv;
  uniform vec2 u_resolution;
  uniform vec4 u_motion;
  uniform vec4 u_clouds[4];
  uniform vec4 u_material[4];
  uniform vec4 u_dance;
  uniform vec4 u_thumps;
  uniform vec2 u_bass;
  uniform vec4 u_music; // Lighting headroom, bass, mid and treble envelopes.
  uniform vec4 u_energy;
  uniform vec4 u_sizes;
  uniform float u_bands[48];
  uniform vec4 u_lights;
  uniform vec4 u_edgeEnergy;
  uniform vec4 u_edgeLights;
  uniform vec4 u_edgeMusic;
  uniform float u_edgeBands[48];
  out vec4 fragColor;
  float hash(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
  float noise(vec2 p,float seed){vec2 i=floor(p)+vec2(seed,seed*.713),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}
  float fbm(vec2 p,float seed){
    float n=0.,a=.53;
    // Fade unresolved octaves toward their mean instead of letting tiny paint
    // details shimmer as a moving cloud crosses pixels (including at 720p).
    float footprint=max(length(dFdx(p)),length(dFdy(p)));
    for(int i=0;i<8;i++){
      float resolved=1.-smoothstep(.35,.85,footprint);
      // Four finer octaves add painted detail, not a brighter/larger cloud.
      // Their zero-mean contribution vanishes below the pixel resolution.
      float sampleValue=resolved>0.?mix(.5,noise(p,seed+float(i)*17.1),resolved):.5;
      n+=a*(sampleValue-(i>=4?.5:0.));
      p=mat2(.8,.6,-.6,.8)*p*2.03+13.7;footprint*=2.03;a*=.5;
    }
    return n;
  }
  vec3 pigment(int i){
    if(i==0)return pow(vec3(0.,142.,248.)/255.,vec3(2.2));
    if(i==1)return pow(vec3(182.,72.,196.)/255.,vec3(2.2));
    if(i==2)return pow(vec3(213.,107.,12.)/255.,vec3(2.2));
    return pow(vec3(52.,217.,0.)/255.,vec3(2.2));
  }
  float spectrum(float k,float overlap){k=clamp(k,0.,47.);int i=int(floor(k)),j=min(i+1,47);float live=mix(u_bands[i],u_bands[j],fract(k));float edge=mix(u_edgeBands[i],u_edgeBands[j],fract(k));return mix(live,edge,overlap);}
  float spot(vec2 p,vec2 centre,vec2 spread){vec2 d=(p-centre)/spread;return exp(-dot(d,d));}
  void main(){
    vec2 uv=v_uv;float aspect=u_resolution.x/u_resolution.y;
    vec2 local[4];float ownership[4];float density[4];float detail[4];float sheen[4];float ray[4];
    float scores[4];float largestScore=-1e20,total=0.;
    // Normalize relative Gaussian scores. This stays well conditioned even
    // when all four volumes are far from a pixel; no absolute cutoff boundary.
    for(int i=0;i<4;i++){
      vec2 d=(uv-u_clouds[i].xy)*vec2(aspect,1.);
      vec2 axis=u_clouds[i].zw;
      local[i]=vec2(dot(d,axis),dot(d,vec2(-axis.y,axis.x)))/u_sizes[i];
      // Only the broad volume flexes. The fine material coordinates below
      // stay independent of this deformation, so they cannot rock back/forth.
      float groove=u_thumps[i]*.45;
      float breath=i==0?.30:i==2?.23:i==1?.20:.16;
      float swell=(1.+breath*u_thumps[i])*(i==0?1.+.05*u_bass.y:1.);
      vec2 spread=vec2(.69,.53)*vec2(1.+.08*groove,1.-.04*groove)*swell;
      vec2 broad=local[i]/spread;
      scores[i]=-dot(broad,broad)*3.8;
      largestScore=max(largestScore,scores[i]);
    }
    float purity=0.;
    for(int i=0;i<4;i++){
      ownership[i]=exp((scores[i]-largestScore)*.92);

    }
    for(int i=0;i<4;i++){
      ownership[i]/=total;purity+=ownership[i]*ownership[i];

    // Slow the shared color region; keep measured attacks quick in clear cores.
    float overlap=smoothstep(.10,.48,1.-purity);
    vec3 col=vec3(.003,.008,.026);

      // energy changes its footprint. Shape and texture motion are independent.
      float seed=19.7+float(i)*43.13,angle=.31+float(i)*1.173;
      // Carry every material layer along the actual signed cloud trajectory.
      // Project screen-space travel into its current local frame before the
      // seeded orientation. Subtracting sample coordinates moves paint in the
      // SAME direction as travel, including reversals and exchanging paths.
      vec2 axis=u_clouds[i].zw,travel=u_material[i].xy*vec2(aspect,1.);
      vec2 paintTravel=vec2(dot(travel,axis),dot(travel,vec2(-axis.y,axis.x)))/.94;
      vec2 p=mat2(cos(angle),sin(angle),-sin(angle),cos(angle))*(local[i]*u_sizes[i]/.94-paintTravel);
      p*=vec2(.94+float(i)*.035,1.06-float(i)*.025);
      // Each cloud has an independent lattice, orientation and gentle domain
      // warp. Seeds never change; audio cannot reseed or rock fine texture.
      vec2 evolution=vec2(u_motion.x+.35*u_motion.z,u_motion.y+.35*u_motion.w);
      vec2 warpPoint=p*1.2+vec2(0.,.30)+evolution*(.16+.025*float(i));
      p+=.16*(vec2(noise(warpPoint,seed+113.),noise(warpPoint+7.1,seed+271.))-.5);
      float mist=fbm(p*2.9+vec2(0.,1.7),seed);
      float grain=fbm(vec2(p.x*9.7,p.y*15.1)+vec2(0.,.8),seed+331.);
      vec2 plane=vec2(p.x*.64+p.y*.77,-p.x*.77+p.y*.64);
      float layers=fbm(vec2(plane.x*3.9,plane.y*38.)+vec2(0.,.55),seed+719.);
      float veil=fbm(vec2(plane.x*7.6,plane.y*25.)+evolution.yx*.13+vec2(2.4,-.9),seed+947.);
      float filament=pow(1.-abs(2.*smoothstep(.25,.73,veil)-1.),3.);
      float pigmentDepth=.095+1.62*pow(smoothstep(.19,.77,mist),1.9);
      density[i]=pigmentDepth*(.47+.88*pow(smoothstep(.16,.80,grain),1.35))*(.78+.40*filament);
      detail[i]=pow(smoothstep(.25,.71,layers),2.)*(.78+.44*filament)+.22*filament*pow(smoothstep(.24,.73,grain),2.);
      float relief=mist+.025*(veil-.5)+.008*(grain-.5);
      vec2 slope=vec2(dFdx(relief)*u_resolution.x,dFdy(relief)*u_resolution.y)*.40;
      vec3 normal=normalize(vec3(-slope,.85));
      sheen[i]=pow(max(0.,dot(normal,normalize(vec3(-.35,.24,1.)))),9.);
      ray[i]=spot(local[i],vec2(-.17,.02),vec2(.60,.17));
      float band=i==0?spectrum(clamp(local[i].x+.5,0.,1.)*14.,overlap):
                 i==1?spectrum(23.+clamp(local[i].x+.5,0.,1.)*10.,overlap):
                 i==2?spectrum(14.+clamp(local[i].x+.5,0.,1.)*9.,overlap):
                      spectrum(33.+clamp(local[i].x+.5,0.,1.)*12.,overlap);
      float energy=mix(u_energy[i],u_edgeEnergy[i],overlap);
      float strength=i==0?.24:i==1?.24:i==2?.43:.29;
      vec3 c=pigment(i);
      float body=strength*density[i]+.035+energy*.09;
      float scattered=ray[i]*(.035+.18*density[i])*(.75+energy*.35);
      float paint=detail[i]*(.17+energy*.22)*(.18+.65*ray[i]);
      float surface=sheen[i]*(.006+band*.08+mix(u_music.w,u_edgeMusic.w,overlap)*.018);
      // Reserve luminance headroom for accents in dense passages.
      float bed=1.-.18*u_music.x;
      col+=c*(body+scattered+paint+surface)*ownership[i]*bed;
    }
    // Each region supplies one smooth accent envelope.
    for(int cloud=0;cloud<4;cloud++){
      float envelope=mix(u_lights[cloud],u_edgeLights[cloud],overlap);
      if(envelope<=0.)continue;
      vec2 p=local[cloud];
      float illumination=spot(p,vec2(-.05,.02),vec2(.70,.43));
      float focus=spot(p,vec2(-.12,.05),vec2(.28,.16));
      float scattering=.20+.80*clamp(density[cloud],0.,1.);
      vec3 c=pigment(cloud);
      col+=c*envelope*(illumination*.92+focus*1.50+ray[cloud]*.70)*scattering*ownership[cloud];
      float highlight=sheen[cloud]*detail[cloud];
      col+=mix(c,vec3(.75),.28)*envelope*highlight*illumination*.75*ownership[cloud];
    }
    col*=1.-.07*dot(uv-.5,uv-.5);
    // The same soft light/paint response and display rolloff, directly into
    // the canvas. No floating-point render targets or per-frame texture copies.
    float peak=max(col.r,max(col.g,col.b));
    col+=col*smoothstep(.12,.36,peak)*.40;
    col=max(vec3(0.),col-min(col.r,min(col.g,col.b))*.72);
    col=1.-exp(-col*.80);
    float lum=dot(col,vec3(.2126,.7152,.0722));
    float rolloff=lum<.10?lum:.10+.075*(1.-exp(-max(0.,lum-.10)/.075));
    col*=rolloff/max(.000001,lum);
    // Sub-LSB dither prevents visible bands in the dark, colored mist.
    vec3 displayColor=pow(max(col,0.),vec3(1./2.2));
    float dither=(hash(gl_FragCoord.xy)-.5)/255.;
    fragColor=vec4(clamp(displayColor+dither,0.,1.),1.);
  }`;
  // One program, one immutable geometry buffer, zero offscreen textures/FBOs.
  // At most one submitted GPU frame: a slow GPU cannot build a command backlog.
  let programs=[],buffer=null,loc={},w=0,h=0,lost=false,stopped=false,raf=0;
  let gpuFence=null,resizePending=true,nextRender=0,rendered=0,gpuSkipped=0;

    // hit barely changes the ceiling; strong close hits build bounded support.

    settle(bassVisual,bassVisualVelocity,1,bassHoldEnvelope,3,dt,.25,.50);

    for(let i=0;i<4;i++){

    let meanMass=0,impactSample=0;
    for(let i=0;i<4;i++){
      energy[i]+=(desiredEnergy[i]-energy[i])*(1-Math.exp(-dt/(desiredEnergy[i]>energy[i]?.035:.30)));
      balance[i]+=(desiredBalance[i]-balance[i])*(1-Math.exp(-dt/.38));
      const share=phraseBalance[i]/Math.max(.0001,balanceSum);

      // root flattened it so weak regions looked almost as large as the bass.
      cloudMass[i]=.75*bodyEnergy[i]+.25*phraseLevel*Math.pow(share,.85);
      meanMass+=cloudMass[i]*.25;
      const baseSize=Math.min(1.50,.84+.46*bodyEnergy[i]+.12*cloudMass[i]);

      const bodySteps=Math.max(1,Math.ceil(dt*120)),bodyDt=dt/bodySteps;
      for(let step=0;step<bodySteps;step++){
        settle(sizes,sizeVelocity,i,sizeTargets[i],absenceFor[i]>.06?12:8,bodyDt,.65,3.5);

      settle(lightEnergy,lightVelocity,i,light,38,dt,5,80);
      settle(renderEnergy,renderEnergyVelocity,i,phraseEnergy[i],12,dt,.9,5);
      if(i)settle(renderMusic,renderMusicVelocity,i,music[i],14,dt,1.4,8);
      amplitudeEnvelope[i]+=(desiredAmplitude[i]-amplitudeEnvelope[i])*(1-Math.exp(-dt/.045));
      const reference=amplitudeReference[i],levelNow=amplitudeEnvelope[i];

      // envelope drives the body, while confirmed attacks add light accents.
      const dynamics=clamp(2.6*Math.max(0,relative-.06));
      const attack=pulse[i]/Math.sqrt(1+(pulse[i]/.9)**2);
      const groove=.78*dynamics*Math.sqrt(energy[i])+.22*attack;
      // Sustained loudness and pitch shifts already drive the phrase size.
      // Do not turn them into extra kicks, or reuse the lighting's decay here.
      const breathResponse=26+5.5/Math.max(.12,bodyDurations[i]);
      for(let step=0;step<hitSteps;step++)settle(thumps,thumpVelocity,i,breathStepTargets[step*4+i],breathResponse,hitDt,8,180);
      // Absolute envelope excursion plus measured attack strength captures drums
      // becoming gentler/stronger even if pads or vocals hold total RMS steady.
      const impact=Math.max(0,levelNow-reference)+.10*attack*levelNow;
      // Bound detector outliers only; visible beat/lighting values stay intact.
      // One exceptionally loud pop must not inflate seconds of impact context.
      const detectorImpact=Math.min(impact,Math.max(.00075,phraseImpact[i]*6));
      impactSample+=detectorImpact;
      phraseImpact[i]+=(detectorImpact-phraseImpact[i])*(1-Math.exp(-dt/1.2));
      amplitudeReference[i]+=(levelNow-amplitudeReference[i])*(1-Math.exp(-dt/1.8));
      settle(dance,danceVelocity,i,groove,14,dt,1.8,10);

      // follows actual cloud travel, rather than an independent oscillation.
      flowDrive[i]+=(groove-flowDrive[i])*(1-Math.exp(-dt/.10));

      // quick core pulse. Retargeting preserves velocity through dense rhythms.
      settle(edgeEnergy,edgeEnergyVelocity,i,phraseEnergy[i],7,dt);
      settle(edgeLights,edgeLightVelocity,i,lightEnergy[i],10,dt,1.8,12);
      settle(edgeMusic,edgeMusicVelocity,i,renderMusic[i],7,dt);
    }
    let lightOccupancy=0;
    for(let i=0;i<4;i++)lightOccupancy+=lightEnergy[i]*.25;
    settle(sceneState,sceneVelocity,1,clamp(.65*sceneState[0]+.35*lightOccupancy),4,dt,.45,1.5);
    renderMusic[0]=clamp(sceneState[1]);
    for(let i=0;i<48;i++){
      settle(renderBands,renderBandVelocity,i,bands[i],18,dt,1.6,12);
      settle(edgeBands,edgeBandVelocity,i,renderBands[i],7,dt);
    }
    if(exchangeA>=0&&now-exchangeStarted>=EXCHANGE_DURATION){
      const a=cloudStates[exchangeA],b=cloudStates[exchangeB],x=a.x,y=a.y,vx=a.vx,vy=a.vy;
      a.x=b.x;a.y=b.y;a.vx=b.vx;a.vy=b.vy;b.x=x;b.y=y;b.vx=vx;b.vy=vy;
      const old=pathSlots[exchangeA];pathSlots[exchangeA]=pathSlots[exchangeB];pathSlots[exchangeB]=old;
      exchangeA=exchangeB=-1;
    }
    // Musical activity can exchange a pair at most once per real minute.
    exchangeCooldown=Math.max(0,EXCHANGE_INTERVAL-(now-exchangeStarted));

    for(let i=0;i<4;i++)sectionPower+=desiredAmplitude[i]*desiredAmplitude[i];
    if(amplitudeReady)rememberContext(dt);
    else if(contextCount||contextElapsed){

      clearContext();
    }
    sectionFast+=(sectionPower-sectionFast)*(1-Math.exp(-dt/1.2));
    sectionSlow=contextCount?contextWeighted[0]:sectionPower;
    const sectionRise=(sectionFast-sectionSlow)/(sectionFast+sectionSlow+.015);
    const present=sectionPower>sectionSlow*1.35+.005?1:0;

      const share=phraseBalance[i]/Math.max(.0001,balanceSum);
      const reference=contextWeighted[0]>.0001?contextWeighted[i+1]/contextWeighted[0]:share;
      const change=share-reference;
      if(change>novelty){novelty=change;leader=i;}
      regionalDrive=Math.max(regionalDrive,flowDrive[i]);
    }
    const active=regionalDrive>.12||driftRhythm>.28;
    const cue=amplitudeReady&&contextCount>=12&&sectionFast>.02&&active&&((sectionRise>.13&&sectionOccupancy>.20)||novelty>.24);
    sectionCue=cue?Math.min(3.1,sectionCue+dt):Math.max(0,sectionCue-dt*2);
    const rebuilt=trackRebuild(dt,active,sectionPower,impactSample);
    const busy=amplitudeReady&&presence>.30&&motionDrive>.52&&percussion>.35;
    swapActivityFor=busy?Math.min(8,swapActivityFor+dt):Math.max(0,swapActivityFor-dt*2);
    const busySwap=contextCount>=12&&swapActivityFor>=4;
    if(exchangeA<0&&exchangeCooldown===0&&(rebuilt||busySwap||(cue&&sectionCue>=2+(1-contextFamiliarity)))){
      if(rebuilt)leader=rebuildLeader;
      else if(novelty<.10){for(let i=1;i<4;i++)if(cloudMass[i]>cloudMass[leader])leader=i;}
      let partner=-1,best=Infinity;
      for(let i=0;i<4;i++)if(i!==leader){
        const distance=Math.hypot(cloudStates[i].x-cloudStates[leader].x,cloudStates[i].y-cloudStates[leader].y);
        const cost=distance/(1+2*Math.max(0,cloudMass[leader]-cloudMass[i]));
        if(cost<best){best=cost;partner=i;}
      }
      exchangeA=leader;exchangeB=partner;exchangeStarted=now;
      exchangeCooldown=EXCHANGE_INTERVAL;sectionCue=0;consumeRebuild();
    }
    for(let i=0;i<4;i++){
      const slot=pathSlots[i],phase=cloudPathPhases[slot];
      pathCentres[i*2]=.5+.32*Math.cos(flowClock*.013+phase)+.07*Math.sin(flowClock*.031+slot*1.7);
      pathCentres[i*2+1]=.5+.32*Math.sin(flowClock*.017+phase)+.07*Math.cos(flowClock*.029+slot*1.9);
    }
    for(let i=0;i<4;i++){
      const c=cloudStates[i],px=c.x*Math.PI,py=c.y*Math.PI;
      const tx=pathCentres[i*2],ty=pathCentres[i*2+1];
      const pathPull=5+1.5*cloudMass[i];
      let fx=(tx-c.x)*pathPull+.30*Math.sin(px+flowClock*.012)*Math.cos(py+flowClock*.017);
      let fy=(ty-c.y)*pathPull-.30*Math.cos(px+flowClock*.012)*Math.sin(py+flowClock*.017);

      fy+=Math.max(0,.14-c.y)*28-Math.max(0,c.y-.86)*28;
      for(let j=0;j<4;j++)if(i!==j){
        const other=cloudStates[j],dx=c.x-other.x,dy=c.y-other.y,d=Math.hypot(dx,dy);

        // neighbors. Same audio gives the same relative emphasis, even when

    const exchangePhase=exchangeA>=0?clamp((now-exchangeStarted)/EXCHANGE_DURATION):0;
    const exchangeTravel=1+easeHit(clamp(exchangePhase/.12))*easeHit(clamp((1-exchangePhase)/.12));
    for(let i=0;i<4;i++){
      const c=cloudStates[i],travel=i===exchangeA||i===exchangeB?exchangeTravel:1;
      const ease=1-Math.exp(-dt*travel/(3.5-2*clamp(sceneState[0])));
      const response=1+.32*(meanMass-cloudMass[i]);
      c.vx*=momentumScale;c.vy*=momentumScale;
      c.vx+=(flowForces[i*2]*.0052*speed*response*travel-c.vx)*ease;c.vy+=(flowForces[i*2+1]*.0052*speed*response*travel-c.vy)*ease;

    }
    exchangePositions(now);
    pressureTargets.fill(0);
    for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){
      const a=cloudStates[i],b=cloudStates[j],dx=a.x-b.x,dy=a.y-b.y,distance=Math.hypot(dx,dy);
      const nx=dx/Math.max(.02,distance),ny=dy/Math.max(.02,distance);

      const expanded=footprint(i,nx,ny,true)+footprint(j,nx,ny,true)-base;

    }
    const pressureSteps=Math.max(1,Math.ceil(dt*120)),pressureDt=dt/pressureSteps;
    for(let i=0;i<4;i++){
      const c=cloudStates[i],k=i*2;

      pressureTargets[k]*=limit;pressureTargets[k+1]*=limit;

        settle(pressureOffsets,pressureVelocity,k,pressureTargets[k],3.4,pressureDt,.009,.025);
        settle(pressureOffsets,pressureVelocity,k+1,pressureTargets[k+1],3.4,pressureDt,.009,.025);
      }
      const x=exchangeWorld[i*4]+pressureOffsets[k],y=exchangeWorld[i*4+1]+pressureOffsets[k+1];
      clouds[i*4]=x;clouds[i*4+1]=y;
      clouds[i*4+2]=Math.cos(c.angle);clouds[i*4+3]=Math.sin(c.angle);
      material[i*4]=.04*(x-materialOrigins[i*2]);material[i*4+1]=.04*(y-materialOrigins[i*2+1]);

    }

    bluePulseCeiling+=(thumps[0]-bluePulseCeiling)*(1-Math.exp(-dt/(thumps[0]>bluePulseCeiling?.025:1.25)));

    motion.set([Math.sin(flowClock*.019),Math.cos(flowClock*.013),Math.sin(flowClock*.011),Math.cos(flowClock*.017)]);

  }
  // Publish uniforms, not pixels or PCM: website and OBS share one live scene.
  let sceneSocket=null,sceneRetry=0,lastScenePublish=0;
  function connectScene(){
    if(stopped||!visible||simulated||sceneSocket)return;
    try{sceneSocket=new WebSocket(`ws://127.0.0.1:${port}/scene`);}
    catch(_error){sceneRetry=setTimeout(connectScene,1500);return;}
    const connection=sceneSocket;
    connection.onerror=()=>{};
    connection.onclose=()=>{if(sceneSocket!==connection)return;sceneSocket=null;if(!stopped&&visible)sceneRetry=setTimeout(connectScene,1500);};
  }
  function publishScene(timestamp){
    if(!sceneSocket||sceneSocket.readyState!==1||sceneSocket.bufferedAmount>16384||timestamp-lastScenePublish<1000/60-.1)return;

    const values={motion,clouds,material,dance,thumps,bass:bassVisual,music:renderMusic,energy:renderEnergy,sizes:renderSizes,
      bands:renderBands,lights:lightEnergy,edgeEnergy,edgeLights,edgeMusic,edgeBands};
    const frame={};for(const key in values)frame[key]=Array.from(values[key],value=>Math.round(value*1000000)/1000000);
    try{sceneSocket.send(JSON.stringify(frame));}catch(_error){sceneSocket.close();}
  }
  function stopScene(){clearTimeout(sceneRetry);sceneRetry=0;if(sceneSocket){sceneSocket.onclose=null;sceneSocket.close();sceneSocket=null;}}
  function render(){
    gl.useProgram(programs[0]);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,w,h);
    gl.uniform2f(loc.res,w,h);gl.uniform4fv(loc.motion,motion);gl.uniform4fv(loc.clouds,clouds);gl.uniform4fv(loc.material,material);gl.uniform4fv(loc.dance,dance);gl.uniform4fv(loc.thumps,thumps);gl.uniform2f(loc.bass,clamp(bassVisual[0]),clamp(bassVisual[1]));gl.uniform4fv(loc.music,renderMusic);gl.uniform4fv(loc.energy,renderEnergy);gl.uniform4fv(loc.sizes,renderSizes);gl.uniform1fv(loc.bands,renderBands);gl.uniform4fv(loc.lights,lightEnergy);
    gl.uniform4fv(loc.edgeEnergy,edgeEnergy);gl.uniform4fv(loc.edgeLights,edgeLights);gl.uniform4fv(loc.edgeMusic,edgeMusic);gl.uniform1fv(loc.edgeBands,edgeBands);

  }
  function frame(timestamp){
    raf=0;if(lost||stopped||!visible)return;

    try{
      update(dt,now);
      if(timestamp+.1>=nextRender){
        if(gpuReady()){
          if(resizePending)resize();render();publishScene(timestamp);
          // Phase-based pacing also gives 60 FPS on 120/144 Hz browser callbacks.
          nextRender=Math.max(nextRender,timestamp-1000/60)+1000/60;
        }else gpuSkipped++;
      }
    }catch(error){report('Graphics stopped safely: '+error.message,true);cleanup();return;}
    raf=requestAnimationFrame(frame);
  }
  function setVisibility(){
    const showing=obsVisible&&!document.hidden;
    if(showing===visible||stopped)return;visible=showing;
    cancelAnimationFrame(raf);raf=0;lastFrame=0;nextRender=0;
    if(!visible){
      stopScene();
      clearTimeout(reconnectTimer);reconnectTimer=0;
      if(socket){socket.onclose=null;socket.onmessage=null;socket.close();socket=null;}
      lastIds=null;lastCloudIds=null;lastReceived=-Infinity;amplitudeReady=false;
      clearContext();
      clearHitTiming();thumpTargets.fill(0);thumps.fill(0);thumpVelocity.fill(0);bassVisual.fill(0);bassVisualVelocity.fill(0);
      for(const light of lights)light.strength=0;
    }else if(!lost){resizePending=true;if(!simulated){connect();connectScene();}raf=requestAnimationFrame(frame);}
  }
  function obsVisibility(event){if(typeof event.detail?.visible==='boolean'){obsVisible=event.detail.visible;setVisibility();}}
  function cleanup(){
    if(stopped)return;stopped=true;stopScene();cancelAnimationFrame(raf);clearTimeout(reconnectTimer);if(observer)observer.disconnect();window.removeEventListener('pagehide',cleanup);
    window.removeEventListener('obsSourceVisibleChanged',obsVisibility);document.removeEventListener('visibilitychange',setVisibility);
    if(socket){socket.onclose=null;socket.onmessage=null;socket.close();socket=null;}
    if(!lost){freeGPU();const release=gl.getExtension('WEBGL_lose_context');if(release)release.loseContext();}
  }
  let observer;
  try{initialize();observer=new ResizeObserver(()=>{resizePending=true;});observer.observe(canvas);}
  catch(error){freeGPU();report('Graphics initialization failed: '+error.message,true);return;}
  canvas.addEventListener('webglcontextlost',event=>{if(stopped)return;event.preventDefault();lost=true;gpuFence=null;cancelAnimationFrame(raf);raf=0;report('Graphics context recovering',true);});
  canvas.addEventListener('webglcontextrestored',()=>{if(stopped||!lost)return;try{initialize();lost=false;lastFrame=0;nextRender=0;report('Graphics recovered');if(visible)raf=requestAnimationFrame(frame);}catch(error){freeGPU();lost=false;report('Graphics recovery failed',true);cleanup();}});
  window.addEventListener('pagehide',cleanup,{once:true});
  window.addEventListener('obsSourceVisibleChanged',obsVisibility);document.addEventListener('visibilitychange',setVisibility);
  if(visible){if(!simulated){connect();connectScene();}raf=requestAnimationFrame(frame);}
})();
</script>
